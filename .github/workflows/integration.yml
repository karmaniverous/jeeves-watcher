name: Integration Tests

# Runs the full test suite against a real Qdrant service so the
# "requires Qdrant" integration suites execute instead of skipping.

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-24.04

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    env:
      # Use the service container above. Setting QDRANT_URL stops the test
      # global setup from downloading and starting a throwaway Qdrant; the
      # container must stay empty of non-test collections (shared-instance guard).
      QDRANT_URL: http://localhost:6333
      # Fail instead of skipping when Qdrant is unreachable (test/globalSetup.ts).
      QDRANT_REQUIRED: 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$QDRANT_URL/healthz" > /dev/null; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
